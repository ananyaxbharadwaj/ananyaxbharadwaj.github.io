<style>.dg-box{fill:var(--surface,#fff);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-strong{fill:var(--accent,#0B6E6E)}.dg-soft{fill:var(--bg,#F4F6F8);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-t{fill:var(--ink,#0F1B2D);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-s{fill:var(--muted,#4F5E6D);font-family:"Archivo",Arial,sans-serif;font-size:13px}.dg-on{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-line{stroke:var(--muted,#4F5E6D);stroke-width:1.5;fill:none}.dg-dash{stroke:var(--line,#D3DBE3);stroke-width:1.5;fill:none;stroke-dasharray:4 4}.dg-head{fill:var(--muted,#4F5E6D)}.dg-bar{fill:var(--line,#D3DBE3)}.dg-big{fill:var(--ink,#1B1530);font-family:"Archivo",Arial,sans-serif;font-size:30px;font-weight:900}.dg-bigon{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:30px;font-weight:900}.dg-kick{fill:var(--muted,#4D4560);font-family:"Archivo",Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em}.dg-kickon{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em}.dg-son{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:13px}.dg-icon{fill:none;stroke:var(--ink,#1B1530);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dg-iconon{fill:none;stroke:var(--on-accent,#fff);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dg-open{fill:var(--surface,#fff);stroke:var(--teal,#0B7368);stroke-width:2.2}.dg-restr{fill:var(--surface,#fff);stroke:var(--pink-ink,#C8245F);stroke-width:2.2;stroke-dasharray:7 5}.dg-tr{fill:var(--pink-ink,#C8245F);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:700}</style>
