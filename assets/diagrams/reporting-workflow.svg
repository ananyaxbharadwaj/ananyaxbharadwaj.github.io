<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226">
<style>.dg-box{fill:var(--surface,#fff);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-strong{fill:var(--accent,#0B6E6E)}.dg-soft{fill:var(--bg,#F4F6F8);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-t{fill:var(--ink,#0F1B2D);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-s{fill:var(--muted,#4F5E6D);font-family:"Archivo",Arial,sans-serif;font-size:13px}.dg-on{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-line{stroke:var(--muted,#4F5E6D);stroke-width:1.5;fill:none}.dg-dash{stroke:var(--line,#D3DBE3);stroke-width:1.5;fill:none;stroke-dasharray:4 4}.dg-head{fill:var(--muted,#4F5E6D)}.dg-bar{fill:var(--line,#D3DBE3)}</style>
