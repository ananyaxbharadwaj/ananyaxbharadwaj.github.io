<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 414" width="930" height="414">
<style>.dg-box{fill:var(--surface,#fff);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-strong{fill:var(--accent,#0B6E6E)}.dg-soft{fill:var(--bg,#F4F6F8);stroke:var(--line,#D3DBE3);stroke-width:1.5}.dg-t{fill:var(--ink,#0F1B2D);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-s{fill:var(--muted,#4F5E6D);font-family:"Archivo",Arial,sans-serif;font-size:13px}.dg-on{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:600}.dg-line{stroke:var(--muted,#4F5E6D);stroke-width:1.5;fill:none}.dg-dash{stroke:var(--line,#D3DBE3);stroke-width:1.5;fill:none;stroke-dasharray:4 4}.dg-head{fill:var(--muted,#4F5E6D)}.dg-bar{fill:var(--line,#D3DBE3)}.dg-big{fill:var(--ink,#1B1530);font-family:"Archivo",Arial,sans-serif;font-size:30px;font-weight:900}.dg-bigon{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:30px;font-weight:900}.dg-kick{fill:var(--muted,#4D4560);font-family:"Archivo",Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em}.dg-kickon{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em}.dg-son{fill:var(--on-accent,#fff);font-family:"Archivo",Arial,sans-serif;font-size:13px}.dg-icon{fill:none;stroke:var(--ink,#1B1530);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dg-iconon{fill:none;stroke:var(--on-accent,#fff);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dg-open{fill:var(--surface,#fff);stroke:var(--teal,#0B7368);stroke-width:2.2}.dg-restr{fill:var(--surface,#fff);stroke:var(--pink-ink,#C8245F);stroke-width:2.2;stroke-dasharray:7 5}.dg-tr{fill:var(--pink-ink,#C8245F);font-family:"Archivo",Arial,sans-serif;font-size:15px;font-weight:700}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="dg-box" x="20" y="24" width="170" height="300" rx="16"/><g transform="translate(48,56)"><path class="dg-icon" d="M-12 -6h9M3 -6h9M-12 4h24"/><path class="dg-icon" d="M-2 -12l4 12"/></g><text class="dg-kick" x="36" y="92">1 · THE GAP</text><text class="dg-s" x="36" y="124">Sales only followed up</text><text class="dg-s" x="36" y="143">inbound ad leads.</text><path class="dg-line" d="M193 174.0H217" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="220" y="24" width="170" height="300" rx="16"/><g transform="translate(248,56)"><path class="dg-icon" d="M-12 -10h24v14h-12l-7 6v-6h-5z"/></g><text class="dg-kick" x="236" y="92">2 · DISCOVERY</text><text class="dg-s" x="236" y="124">Discovery call with</text><text class="dg-s" x="236" y="143">client leadership.</text><rect class="dg-box" x="440" y="24" width="230" height="192" rx="16"/><g transform="translate(468,52)"><rect class="dg-icon" x="-12" y="-11" width="24" height="16" rx="2"/><path class="dg-icon" d="M0 5v7M-6 12h12M-6 -1l4-4 4 3 5-5"/></g><text class="dg-kick" x="456" y="84">3 · CREATIVE</text><text class="dg-kick" x="456" y="99">GO-TO-MARKET PITCH</text><text class="dg-big" x="456" y="134">7–8</text><text class="dg-s" x="456" y="158">a month: 2–3 campaign ideas,</text><text class="dg-s" x="456" y="176">launch plans and sample</text><text class="dg-s" x="456" y="194">creatives</text><rect class="dg-box" x="440" y="228" width="230" height="96" rx="16"/><g transform="translate(640,254)"><circle class="dg-icon" cx="-3" cy="-3" r="8"/><path class="dg-icon" d="M3 3l8 8"/></g><text class="dg-kick" x="456" y="256">3 · GENERIC PITCHES</text><text class="dg-big" x="456" y="294">20–30</text><text class="dg-s" x="560" y="294">a month</text><path class="dg-line" d="M393 174.0C415 174.0 415 120.0 437 120.0" marker-end="url(#dg-arrow)"/><path class="dg-line" d="M393 174.0C415 174.0 415 276.0 437 276.0" marker-end="url(#dg-arrow)"/><rect class="dg-strong" x="720" y="24" width="190" height="300" rx="16"/><g transform="translate(748,56)"><circle class="dg-iconon" cx="0" cy="0" r="11"/><path class="dg-iconon" d="M-5 0l3.5 3.5L6 -4"/></g><text class="dg-kickon" x="736" y="92">4 · CLOSE</text><text class="dg-bigon" x="736" y="130">3 in 8</text><text class="dg-son" x="736" y="156">about 3 in 8 creative</text><text class="dg-son" x="736" y="175">pitches converted,</text><text class="dg-son" x="736" y="194">winning 12–15 new</text><text class="dg-son" x="736" y="213">clients</text><path class="dg-line" d="M673 120.0C695 120.0 695 174.0 717 174.0" marker-end="url(#dg-arrow)"/><path class="dg-dash" d="M673 276.0C695 276.0 695 174.0 714 174.0"/><path class="dg-line" d="M815 326V364H682" marker-end="url(#dg-arrow)"/><rect class="dg-soft" x="400" y="340" width="280" height="50" rx="12"/><text class="dg-t" x="540" y="362" text-anchor="middle">Client portfolio</text><text class="dg-s" x="540" y="380" text-anchor="middle">managed directly or by my team</text></svg>
